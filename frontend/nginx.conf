# Serves the built SPA inside the frontend container (behind the proxy nginx).
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which must not be cached so
    # new deploys are picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
