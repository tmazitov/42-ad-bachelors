# Production stack (e.g. on Coolify):
#   nginx    — the only entry point; routes /api/* to the backend and
#              everything else to the frontend. Plain HTTP on NGINX_PORT
#              (default 8088): the platform's proxy (Coolify) terminates TLS
#              and forwards to it.
#   frontend — static SPA; reachable only from nginx (network `web`).
#   backend  — Go API + SQLite (backend-data volume); reachable only from
#              nginx (network `api`), with outbound internet for the 42 API.
#
# No service publishes host ports. In Coolify, assign the domain to the
# `nginx` service with its port, e.g. https://bachelors.example.com:8088
# (the port tells Coolify's proxy where nginx listens; users still use 443),
# and fill in the environment variables below
# (see .env.example). Register PUBLIC_URL/auth/callback on the 42 app.

services:
  nginx:
    build: ./deploy/nginx
    environment:
      NGINX_PORT: ${NGINX_PORT:-8088}
    expose:
      - "${NGINX_PORT:-8088}"
    networks:
      - web
      - api
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "80"
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  backend:
    build: ./backend
    # Values come from .env next to this file (local) or Coolify's
    # environment settings; optional ones default to the backend's defaults.
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://bachelors.example.com}
      FT_CLIENT_ID: ${FT_CLIENT_ID:?set FT_CLIENT_ID (42 OAuth app UID)}
      FT_CLIENT_SECRET: ${FT_CLIENT_SECRET:?set FT_CLIENT_SECRET (42 OAuth app secret)}
      FT_REDIRECT_URI: ${PUBLIC_URL}/auth/callback
      SESSION_TTL: ${SESSION_TTL:-720h}
      STUDENT_MAX_AGE: ${STUDENT_MAX_AGE:-2m}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-1h}
      SYNC_MAX_AGE: ${SYNC_MAX_AGE:-24h}
      FT_RATE_PER_SECOND: ${FT_RATE_PER_SECOND:-2}
      FT_RATE_PER_HOUR: ${FT_RATE_PER_HOUR:-1200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      DATABASE_PATH: /data/app.db
    expose:
      - "8080"
    networks:
      - api
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  # nginx <-> frontend; no internet access needed.
  web:
    internal: true
  # nginx <-> backend; a regular bridge so the backend can reach the 42 API.
  api:

volumes:
  backend-data:
