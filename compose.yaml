# Production stack for a single VPS:
#   web     — Caddy: serves the built frontend, proxies /api to the backend,
#             and handles HTTPS (Let's Encrypt) for SITE_ADDRESS.
#   backend — Go API + SQLite (on the backend-data volume); not exposed.
#
# Setup: cp .env.example .env (domain), cp backend/.env.example backend/.env
# (42 credentials), register PUBLIC_URL/auth/callback on the 42 app, then
#   docker compose up -d --build

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # These override backend/.env so the stack is consistent.
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      FT_REDIRECT_URI: ${PUBLIC_URL}/auth/callback
      HTTP_ADDR: ":8080"
      DATABASE_PATH: /data/app.db
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  caddy-data:
  caddy-config:
